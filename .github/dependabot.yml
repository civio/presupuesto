version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      # Security fixes ignore the schedule; this bundles the ones pending at the same time into one PR
      security:
        applies-to: security-updates
        patterns: ["*"]
    # Major upgrades (Django, notably) need hands-on work, so we do them ourselves
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      javascript:
        applies-to: version-updates
        patterns: ["*"]
      # Security fixes ignore the schedule and arrive when the advisory is published;
      # this only bundles the ones pending at the same time into one PR
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        update-types: ["minor", "patch"]
