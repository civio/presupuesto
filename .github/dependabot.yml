version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
    # Major upgrades (Django, notably) need hands-on work, so we do them ourselves
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Newer versions need Django 4.2, see civio/presupuesto-management#1405
      - dependency-name: "django-compressor"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      javascript:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
